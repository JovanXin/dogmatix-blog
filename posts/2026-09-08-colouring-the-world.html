<!DOCTYPE html>
<html class="staticrypt-html" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <title>Dogmatix Log</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="pragma" content="no-cache" />
        <style>
            :root{
                --bg:#0a0c10; --card:#12161e; --line:#202836; --line2:#2b3547;
                --fg:#ccd4de; --dim:#6f7a8a; --bright:#f0f4f9; --amber:#ffb454;
            }
            *{box-sizing:border-box}
            html.staticrypt-html{height:100%}
            body.staticrypt-body{
                height:100%;margin:0;background:var(--bg);color:var(--fg);
                font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
                background-image:radial-gradient(circle at 18% -10%,rgba(90,209,200,.08),transparent 45%),
                                 radial-gradient(circle at 88% 0%,rgba(255,180,84,.07),transparent 42%);
                -webkit-font-smoothing:antialiased;
            }
            .staticrypt-content{
                min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 20px;
                background:transparent;
                font-family:inherit;
            }
            .staticrypt-page{width:100%;max-width:392px;padding:0;margin:0}
            .staticrypt-form{
                position:relative;z-index:1;background:var(--card);border:1px solid var(--line);
                border-radius:16px;padding:34px 32px 30px;text-align:center;
                box-shadow:0 22px 60px -22px rgba(0,0,0,.85);
            }
            .staticrypt-form .lockmark{font-size:22px;color:var(--amber);display:block;margin-bottom:14px}
            .staticrypt-instructions{margin:0 0 20px}
            .staticrypt-title{
                font-size:21px;font-weight:700;color:var(--bright);margin:0 0 5px;letter-spacing:.02em;
            }
            .staticrypt-instructions p:not(.staticrypt-title){
                font-size:12px;color:var(--dim);margin:0;letter-spacing:.06em;text-transform:uppercase;
            }
            .staticrypt-hr{border:0;border-top:1px solid var(--line);margin:0 0 20px}
            .staticrypt-password-container{position:relative;margin:0 0 13px}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{
                width:100%;background:#0b0e13;border:1px solid var(--line);border-radius:10px;
                color:var(--fg);font:15px/1 inherit;padding:14px 44px 14px 15px;outline:0;
            }
            .staticrypt-form input[type="password"]:focus,.staticrypt-form input[type="text"]:focus{
                border-color:var(--amber);
            }
            .staticrypt-toggle-password-visibility{
                cursor:pointer;height:19px;width:19px;opacity:.5;position:absolute;right:13px;top:50%;
                transform:translateY(-50%);
            }
            .staticrypt-toggle-password-visibility:hover{opacity:.9}
            .staticrypt-form .staticrypt-decrypt-button{
                width:100%;border:0;border-radius:10px;padding:14px;cursor:pointer;
                background:var(--amber);color:#141005;font:600 14px/1 inherit;letter-spacing:.05em;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover{filter:brightness(93%)}
            label.staticrypt-remember{
                display:flex;align-items:center;justify-content:center;gap:9px;
                margin:15px 0 0;font-size:12.5px;color:var(--dim);cursor:pointer;
            }
            .staticrypt-remember input[type="checkbox"]{accent-color:var(--amber);width:15px;height:15px;margin:0}
            .staticrypt-foot{margin:18px 0 0;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.6}
            .hidden{display:none !important}
            .staticrypt-spinner-container{height:100vh;display:flex;align-items:center;justify-content:center}
            .staticrypt-spinner{
                display:inline-block;width:2rem;height:2rem;border:.25em solid var(--line2);
                border-right-color:transparent;border-radius:50%;
                animation:spinner-border .75s linear infinite;
            }
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
        </style>
    </head>
